name: Fix Russian tagline line break
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fix-tagline-break.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace("tag:'Сомневаетесь?<br>Спросите WHY NOT?!'", "tag:'Сомневаетесь?\\nСпросите WHY NOT?!'")
          s=s.replace('.sub{font-size:', '.sub{white-space:pre-line;font-size:')
          s=s.replace("document.getElementById('tagline').innerHTML=t.tag", "document.getElementById('tagline').textContent=t.tag")
          p.write_text(s)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Render Russian tagline on two lines safely" || exit 0
          git push