name: Change Russian tagline
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/change-tagline.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace("tag:'Пусть ИИ решит, а виноват будет потом'", "tag:'Сомневаетесь? Спросите WHY NOT?!'")
          p.write_text(s)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Change Russian hero tagline" || exit 0
          git push