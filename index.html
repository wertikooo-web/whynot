const Q=[['🍷','life','Can I drink wine today?','Можно ли сегодня пить вино?','Pot să beau vin azi?'],['🍰','life','Order another dessert?','Заказать ещё десерт?','Să mai comand un desert?'],['🛋️','life','Do nothing today?','Можно сегодня ничего не делать?','Pot să nu fac nimic azi?'],['🎉','life','Go to that party?','Идти на эту вечеринку?','Să merg la petrecere?'],['📺','life','Watch one more episode?','Смотреть ещё одну серию?','Încă un episod?'],['🐈','life','Get a cat?','Завести кота?','Să iau o pisică?'],['💋','rel','Kiss them?','Поцеловать его или её?','Să-l sau s-o sărut?'],['🔥','rel','Sleep with them?','Переспать с ним или с ней?','Să mă culc cu el sau cu ea?'],['💬','rel','Text my ex?','Написать бывшему?','Să-i scriu fostului?'],['❤️','rel','Go on the date?','Идти на свидание?','Să merg la întâlnire?'],['🌙','rel','Stay the night?','Остаться на ночь?','Să rămân peste noapte?'],['🔁','rel','Give them another chance?','Дать ещё один шанс?','Să-i mai dau o șansă?'],['💼','work','Quit my job?','Уволиться?','Să-mi dau demisia?'],['😴','work','Skip work today?','Прогулять работу?','Să chiulesc azi?'],['📨','work','Send that email?','Отправить это письмо?','Să trimit mesajul?'],['🙋','work','Ask for a raise?','Попросить прибавку?','Să cer o mărire?'],['🛍️','money','Buy this thing?','Купить эту вещь?','Să cumpăr asta?'],['⌚','money','Buy another watch?','Купить ещё одни часы?','Să mai cumpăr un ceas?'],['💸','money','Spend the money?','Потратить эти деньги?','Să cheltui banii?'],['✈️','travel','Book the flight?','Покупать билет?','Să cumpăr biletul?'],['🧳','travel','Take another trip?','Поехать ещё в одно путешествие?','Să mai plec într-o călătorie?'],['🌍','travel','Move abroad?','Переехать в другую страну?','Să mă mut în altă țară?'],['🏖️','travel','Take a spontaneous weekend away?','Сорваться куда-нибудь на выходные?','Să plec spontan în weekend?'],['🍕','life','Order pizza?','Заказать пиццу?','Să comand pizza?'],['📱','life','Delete the app?','Удалить приложение?','Să șterg aplicația?'],['🎤','life','Sing karaoke?','Пойти петь караоке?','Să cânt karaoke?'],['📸','life','Post that photo?','Выложить эту фотографию?','Să postez fotografia?'],['🧠','life','Stop overthinking it?','Перестать уже это обдумывать?','Să nu mă mai gândesc atât?']];
const BANK={
ru:{rel:{yes:['ДА. ХИМИЯ ЗАСЧИТАНА.','ПОХОЖЕ, ТЫ УЖЕ РЕШИЛА.','МОЖНО. НО С ГОЛОВОЙ.'],no:['НЕТ. НЕ СЕГОДНЯ.','ОСТАВЬ ЭТУ ИДЕЮ В ЧЕРНОВИКАХ.','ПУСТЬ СНАЧАЛА ПОЯВИТСЯ ЯСНОСТЬ.'],wait:['НЕ ТОРОПИСЬ.','ПЕРЕСПИ С ЭТОЙ МЫСЛЬЮ. БУКВАЛЬНО БЕЗ НЕГО.','ДАЙ ЭТОМУ ЕЩЁ ОДИН ДЕНЬ.'],why:['Если желание твоё, согласие взаимное и утром не придётся собирать себя совком, аргументы у идеи есть.','Тут полезнее проверить собственное желание, чем искать разрешение у оракула.','Если приходится долго уговаривать себя, это уже информация.','Химия прекрасна. Последствия тоже любят приходить на встречу.','Твоя будущая версия просит хотя бы пять минут подумать о завтрашнем утре.','Любопытство считается аргументом. Давление со стороны другого человека не считается.']},work:{yes:['ДЕЛАЙ.','ПОРА ДВИГАТЬСЯ.','ДА. ХВАТИТ РЕПЕТИРОВАТЬ.'],no:['НЕ СЕЙЧАС.','НЕ РУБИ С ПЛЕЧА.','СНАЧАЛА ПЛАН.'],wait:['ДАЙ СЕБЕ 24 ЧАСА.','СНАЧАЛА ПОСЧИТАЙ ПОСЛЕДСТВИЯ.','ПЕРЕНОЧУЙ С РЕШЕНИЕМ.'],why:['Если мысль возвращается месяцами, возможно, проблема уже не в плохом понедельнике.','Сильные рабочие решения лучше переживают хотя бы одну ночь и один калькулятор.','Раздражение хороший сигнал, но посредственный карьерный консультант.','Если есть следующий шаг и финансовая подушка, идея звучит заметно взрослее.','Проверь, хочешь ли ты уйти отсюда или прийти куда-то конкретно.','Иногда лучший первый шаг выглядит скучно: обновить резюме и проверить рынок.']},money:{yes:['БЕРИ.','МОЖНО СЕБЕ ПОЗВОЛИТЬ.','ЛАДНО. ПОКУПАЙ.'],no:['ЗАКРОЙ ВКЛАДКУ.','ТЕБЕ ЭТО НЕ НУЖНО.','КОШЕЛЁК СКАЗАЛ НЕТ.'],wait:['ОСТАВЬ В КОРЗИНЕ ДО ЗАВТРА.','ПОДОЖДИ 48 ЧАСОВ.','СНАЧАЛА СРАВНИ ЦЕНЫ.'],why:['Если завтра всё ещё захочется и бюджет не застонет, покупка пережила хороший тест.','Ты пришёл сюда за разрешением. Кошелёк, возможно, голосовал иначе.','Цена удовольствия тоже часть удовольствия. Если после покупки будет тревожно, скидка не спасёт.','Если вещь решает реальную проблему, у неё уже есть аргумент сильнее рекламы.','Пятый похожий предмет обычно не становится судьбоносным шестым.','Спроси себя: я хочу эту вещь или ощущение, которое обещает реклама?']},travel:{yes:['ПОКУПАЙ БИЛЕТ.','ЛЕТИ.','ПОХОЖЕ, ПОРА ЕХАТЬ.'],no:['НЕ ЭТОТ БИЛЕТ.','ПОИЩИ ЕЩЁ.','МАРШРУТ ПОКА НЕ УБЕЖДАЕТ.'],wait:['ПРОВЕРЬ ЦЕНУ ЕЩЁ РАЗ ЗАВТРА.','СРАВНИ ДАТЫ.','ДАЙ МАРШРУТУ ЕЩЁ ОДИН ШАНС.'],why:['Если ты открываешь этот билет четвёртый раз, исследовательская фаза подозрительно затянулась.','Путешествие должно радовать ещё до вылета. Если уже сейчас одни компромиссы, посмотри альтернативы.','Хорошая цена плюс подходящие даты обычно сильнее надежды поймать мифические минус десять евро.','Проверь полную стоимость с багажом, трансферами и ночёвками. А потом уже романтизируй.','Иногда билет дорожает быстрее, чем мы принимаем решения. Но паника всё равно плохой турагент.','Если маршрут вписывается в деньги и время, воспоминания обычно окупаются лучше очередной вещи.']},life:{yes:['ДА.','ПОЧЕМУ БЫ И НЕТ?','РАЗРЕШАЕТСЯ.'],no:['НЕТ.','СЕГОДНЯ ПРОПУСТИ.','НЕ НАДО.'],wait:['ПОДОЖДИ ДО ЗАВТРА.','ДАЙ СЕБЕ ЧАС.','СНАЧАЛА ВЫДОХНИ.'],why:['Ты уже потратил на размышления больше энергии, чем заслуживает это решение.','Если последствия маленькие, эксперимент тоже может быть маленьким.','Твоя завтрашняя версия имеет право голоса. Послушай её секунд тридцать.','Иногда желание отдохнуть означает ровно то, что написано на упаковке.','Если решение легко отменить, требования к идеальной уверенности можно немного снизить.','Сомнение не всегда предупреждение. Иногда это привычка всё усложнять.']}},
en:{rel:{yes:['YES. CHEMISTRY NOTED.','YOU ALREADY KNOW.','YES, WITH YOUR EYES OPEN.'],no:['NO. NOT TODAY.','LEAVE IT IN DRAFTS.','GET CLARITY FIRST.'],wait:['SLOW DOWN.','GIVE IT A DAY.','SLEEP ON THE IDEA.'],why:['If the desire is yours, consent is mutual and tomorrow still looks okay, the idea has a case.','Check what you actually want before asking an oracle for permission.','If you have to talk yourself into it for twenty minutes, that is useful data.','Chemistry is lovely. Consequences also RSVP.','Your future self requests five minutes of consideration.','Curiosity counts. Pressure from someone else does not.']},work:{yes:['DO IT.','TIME TO MOVE.','YES. STOP REHEARSING.'],no:['NOT YET.','DON’T BURN IT DOWN TODAY.','PLAN FIRST.'],wait:['GIVE IT 24 HOURS.','COUNT THE CONSEQUENCES.','SLEEP ON IT.'],why:['If the thought keeps returning for months, this may be bigger than a bad Monday.','Strong career decisions survive one night and one calculator.','Anger is a signal, not a career coach.','A next step and a financial cushion make this idea much more adult.','Ask whether you want to leave here or actually go somewhere.','Sometimes the brave first move is updating your résumé.']},money:{yes:['BUY IT.','YOU CAN HAVE IT.','FINE. GET IT.'],no:['CLOSE THE TAB.','YOU DO NOT NEED IT.','YOUR WALLET VOTED NO.'],wait:['LEAVE IT IN THE CART.','WAIT 48 HOURS.','COMPARE PRICES FIRST.'],why:['If you still want it tomorrow and the budget does not scream, it passed a useful test.','You came here for permission. Your wallet may have filed a dissent.','The cost of the pleasure is part of the pleasure.','If it solves a real problem, that beats most advertising.','The sixth version of the same thing rarely changes your destiny.','Do you want the object, or the feeling the ad promised?']},travel:{yes:['BOOK IT.','GO.','TIME TO TRAVEL.'],no:['NOT THIS FLIGHT.','KEEP LOOKING.','THIS ROUTE IS NOT IT.'],wait:['CHECK AGAIN TOMORROW.','COMPARE THE DATES.','GIVE THE ROUTE ONE MORE LOOK.'],why:['If you have opened this fare four times, the research phase is getting suspicious.','A trip should feel good before departure too.','A good fare and good dates often beat chasing a mythical tiny discount.','Check baggage, transfers and hotel nights before romanticizing the price.','Fares can move faster than decisions, but panic is still a terrible travel agent.','If it fits the time and budget, memories often age better than another purchase.']},life:{yes:['YES.','WHY NOT?','PERMISSION GRANTED.'],no:['NOPE.','SKIP IT TODAY.','NOT THIS ONE.'],wait:['WAIT UNTIL TOMORROW.','GIVE IT AN HOUR.','PAUSE FIRST.'],why:['You have already spent more energy thinking than this decision deserves.','If the consequences are small, the experiment can be small too.','Your tomorrow-self gets a vote.','Sometimes wanting rest means exactly what it says.','If the decision is reversible, perfect certainty is overrated.','Doubt is not always a warning. Sometimes it is just a habit.']}},
ro:{rel:{yes:['DA. CHIMIA E CLARĂ.','ȘTII DEJA CE VREI.','DA, DAR CU OCHII DESCHIȘI.'],no:['NU. NU AZI.','LASĂ IDEEA ÎN SCHIȚE.','MAI ÎNTÂI CLARITATE.'],wait:['NU TE GRĂBI.','MAI DĂ-I O ZI.','DORMI CU GÂNDUL ĂSTA.'],why:['Dacă dorința e a ta, consimțământul e reciproc și mâine totul pare în regulă, ideea are argumente.','Verifică ce vrei tu înainte să ceri voie de la oracol.','Dacă trebuie să te convingi mult, asta spune ceva.','Chimia e frumoasă. Consecințele vin și ele.','Versiunea ta de mâine cere cinci minute de reflecție.','Curiozitatea contează. Presiunea altcuiva nu.']},work:{yes:['FĂ-O.','E TIMPUL SĂ MIȘTI.','DA. AJUNGE CU REPETIȚIILE.'],no:['NU ÎNCĂ.','NU ARDE PODURILE AZI.','ÎNTÂI PLANUL.'],wait:['DĂ-I 24 DE ORE.','CALCULEAZĂ CONSECINȚELE.','DORMI CU DECIZIA.'],why:['Dacă gândul revine de luni întregi, poate nu e doar o zi proastă.','Deciziile bune de carieră supraviețuiesc unei nopți și unui calculator.','Furia e un semnal, nu un consultant de carieră.','Un pas următor și o rezervă financiară fac ideea mai matură.','Întreabă-te dacă vrei să pleci de aici sau să ajungi undeva anume.','Uneori primul pas curajos e să-ți actualizezi CV-ul.']},money:{yes:['CUMPĂRĂ.','ÎȚI POȚI PERMITE.','BINE. IA-L.'],no:['ÎNCHIDE FILA.','NU AI NEVOIE DE ASTA.','PORTOFELUL A ZIS NU.'],wait:['LASĂ-L ÎN COȘ.','AȘTEAPTĂ 48 DE ORE.','COMPARĂ PREȚURILE.'],why:['Dacă îl mai vrei mâine și bugetul nu plânge, a trecut un test bun.','Ai venit după permisiune. Portofelul poate avea altă opinie.','Prețul plăcerii face parte din plăcere.','Dacă rezolvă o problemă reală, are deja un argument bun.','Al șaselea obiect asemănător rareori schimbă destinul.','Vrei obiectul sau senzația promisă de reclamă?']},travel:{yes:['CUMPĂRĂ BILETUL.','PLEACĂ.','E TIMPUL DE O CĂLĂTORIE.'],no:['NU BILETUL ĂSTA.','MAI CAUTĂ.','RUTA ASTA NU CONVINGE.'],wait:['VERIFICĂ DIN NOU MÂINE.','COMPARĂ DATELE.','MAI UITĂ-TE O DATĂ.'],why:['Dacă ai deschis biletul de patru ori, cercetarea durează suspect de mult.','O călătorie ar trebui să bucure și înainte de plecare.','Un preț bun și date bune bat adesea vânătoarea unei reduceri mitice.','Verifică bagajul, transferurile și nopțile de hotel înainte de a romantiza prețul.','Prețurile se mișcă repede, dar panica rămâne un agent de turism prost.','Dacă încape în timp și buget, amintirile îmbătrânesc frumos.']},life:{yes:['DA.','DE CE NU?','APROBAT.'],no:['NU.','SARI PESTE ASTA AZI.','NU ACUM.'],wait:['AȘTEAPTĂ PÂNĂ MÂINE.','MAI DĂ-I O ORĂ.','FĂ O PAUZĂ.'],why:['Ai consumat deja mai multă energie gândindu-te decât merită decizia.','Dacă urmările sunt mici, și experimentul poate fi mic.','Versiunea ta de mâine are și ea un vot.','Uneori dorința de odihnă înseamnă exact asta.','Dacă decizia e reversibilă, certitudinea perfectă nu e necesară.','Îndoiala nu e mereu un avertisment. Uneori e doar un obicei.']}}};
const KW={rel:/sex|sleep with|kiss|date|ex\b|love|relationship|boyfriend|girlfriend|пересп|секс|поцел|свидан|бывш|отношен|люб|culc|sărut|intaln|întâln|fost|relaț|iub/,work:/job|work|boss|career|raise|quit|email|работ|увол|началь|карьер|письм|demis|munc|șef|carier|salari/,money:/buy|price|money|spend|watch|shoes|куп|цен|деньг|потрат|час|cump|preț|bani|chelt/,travel:/flight|ticket|travel|trip|hotel|country|move abroad|билет|лет|путеше|поезд|отел|стран|bilet|zbor|călător|hotel|țară/,life:/.*/};
const danger=/suicide|kill myself|self.?harm|overdose|weapon|drive drunk|насил|самоуб|убить себя|пьяным за рул|sinucid|omor pe mine|conduc beat/i;
let lang=localStorage.getItem('whyLang')||'en',lastKey='';function cat(q){for(const k of ['rel','work','money','travel'])if(KW[k].test(q.toLowerCase()))return k;return'life'}function pick(a,avoid=''){let options=a.map((x,i)=>[x,i]).filter(x=>String(x[1])!==avoid);return options[Math.floor(Math.random()*options.length)]||[a[0],0]}function answer(){let q=document.getElementById('question').value.trim();if(!q)return;if(danger.test(q)){const s=lang==='ru'?['СТОП.','Здесь лучше не полагаться на шуточный оракул. Если есть риск для тебя или другого человека, выбери безопасный вариант и обратись за реальной помощью.']:lang==='ro'?['STOP.','Aici nu e cazul pentru un oracol în glumă. Dacă există risc pentru tine sau altcineva, alege varianta sigură și caută ajutor real.']:['STOP.','This is not a good place for a joke oracle. If there is risk to you or someone else, choose the safe option and get real help.'];show(s);return}let c=cat(q),b=BANK[lang][c],types=['yes','no','wait'],type=types[Math.floor(Math.random()*types.length)],v=pick(b[type]),r=pick(b.why);let key=c+type+v[1]+r[1];if(key===lastKey){r=pick(b.why,String(r[1]));key=c+type+v[1]+r[1]}lastKey=key;show([v[0],r[0]])}function show(x){document.getElementById('verdict').textContent=x[0];document.getElementById('reason').textContent=x[1];document.getElementById('result').classList.add('show');document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
function render(){let t=UI[lang];document.documentElement.lang=lang;document.getElementById('askTop').textContent=t.ask;document.getElementById('tagline').textContent=t.tag;document.getElementById('heroCopy').textContent=t.hero;document.getElementById('question').placeholder=t.ph;document.getElementById('decide').textContent=t.dec;document.getElementById('kicker').textContent=t.kick;document.getElementById('again').textContent=t.again;document.getElementById('share').textContent=t.share;document.getElementById('fine').textContent=t.fine;document.getElementById('float1').textContent=t.f1;document.getElementById('float2').textContent=t.f2;document.getElementById('galleryTitle').textContent=t.gt;document.getElementById('galleryLead').textContent=t.gl;document.getElementById('moodsTitle').textContent=t.moods;document.getElementById('footer').textContent=t.foot;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.getElementById('quick').innerHTML=t.quick.map((x,i)=>`<button>${['✈️','💬','💼','🔥'][i]} ${x}</button>`).join('');document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>{document.getElementById('question').value=b.textContent.replace(/^\S+\s/,'');answer()});document.getElementById('cards').innerHTML=t.cards.map(x=>`<div class="card"><div style="font-size:34px">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('');renderGallery('all')}
function renderGallery(f){let t=UI[lang],cats=['all','rel','work','money','travel','life'];document.getElementById('filters').innerHTML=t.filters.map((x,i)=>`<button class="filter ${cats[i]===f?'active':''}" data-f="${cats[i]}">${x}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>renderGallery(b.dataset.f));let li=lang==='en'?2:lang==='ru'?3:4;document.getElementById('qgrid').innerHTML=Q.filter(x=>f==='all'||x[1]===f).map(x=>`<button class="qcard" data-q="${x[li].replace(/"/g,'&quot;')}"><span class="qicon">${x[0]}</span><span class="qtext">${x[li]}</span></button>`).join('');document.querySelectorAll('.qcard').forEach(b=>b.onclick=()=>{document.getElementById('question').value=b.dataset.q;answer()})}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('whyLang',lang);render()});document.getElementById('decide').onclick=answer;document.getElementById('again').onclick=answer;document.getElementById('askTop').onclick=()=>document.getElementById('question').focus();document.getElementById('question').addEventListener('keydown',e=>{if(e.key==='Enter')answer()});document.getElementById('share').onclick=async()=>{let text=`WHY NOT?\n${document.getElementById('question').value}\n${document.getElementById('verdict').textContent}\n${document.getElementById('reason').textContent}`;if(navigator.share)try{await navigator.share({text})}catch(e){}else navigator.clipboard?.writeText(text)};render();
</script></body></html>
