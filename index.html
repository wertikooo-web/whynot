let lang=localStorage.getItem('whyLang')||'en';function cat(q){for(const k of ['rel','work','money','travel'])if(KW[k].test(q.toLowerCase()))return k;return'life'}function answer(){let q=document.getElementById('question').value.trim();if(!q)return;let x=A[lang][cat(q)];document.getElementById('verdict').textContent=x[0];document.getElementById('reason').textContent=x[1];document.getElementById('result').classList.add('show');document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderGallery(f='all'){let t=UI[lang],cats=['all','rel','work','money','travel','life'];document.getElementById('filters').innerHTML=t.filters.map((x,i)=>`<button class="filter ${cats[i]===f?'active':''}" data-f="${cats[i]}">${x}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>renderGallery(b.dataset.f));let li=lang==='en'?2:lang==='ru'?3:4;document.getElementById('qgrid').innerHTML=Q.filter(x=>f==='all'||x[1]===f).map(x=>`<button class="qcard" data-q="${x[li].replace(/"/g,'&quot;')}"><span class="qicon">${x[0]}</span><span class="qtext">${x[li]}</span></button>`).join('');document.querySelectorAll('.qcard').forEach(b=>b.onclick=()=>{document.getElementById('question').value=b.dataset.q;answer()})}
function render(){let t=UI[lang];document.documentElement.lang=lang;['askTop','tagline','heroCopy','decide','kicker','again','share','fine','float1','float2','galleryTitle','galleryLead','moodsTitle','footer','disclaimer'].forEach((id,i)=>document.getElementById(id).textContent=[t.ask,t.tag,t.hero,t.dec,t.kick,t.again,t.share,t.fine,t.f1,t.f2,t.gt,t.gl,t.moods,t.foot,t.disclaimer][i]);document.getElementById('question').placeholder=t.ph;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.getElementById('quick').innerHTML=t.quick.map((x,i)=>`<button>${['✈️','💬','💼','🔥'][i]} ${x}</button>`).join('');document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>{document.getElementById('question').value=b.textContent.replace(/^\S+\s/,'');answer()});document.getElementById('cards').innerHTML=t.cards.map(x=>`<div class="card"><div style="font-size:34px">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('');renderGallery()}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('whyLang',lang);render()});document.getElementById('decide').onclick=answer;document.getElementById('again').onclick=answer;document.getElementById('askTop').onclick=()=>document.getElementById('question').focus();document.getElementById('question').addEventListener('keydown',e=>{if(e.key==='Enter')answer()});document.getElementById('share').onclick=async()=>{let text=`WHY NOT?\n${document.getElementById('question').value}\n${document.getElementById('verdict').textContent}\n${document.getElementById('reason').textContent}`;if(navigator.share)try{await navigator.share({text})}catch(e){}else navigator.clipboard?.writeText(text)};render();
