const danger=/suicide|kill myself|self.?harm|overdose|weapon|drive drunk|насил|самоуб|убить себя|пьяным за рул|sinucid|omor pe mine|conduc beat/i;
let lang=localStorage.getItem('whyLang')||'en',mode=localStorage.getItem('whyMode')||'human';const keys=['reason','universe','human','wild'];function cat(q){for(const k of ['rel','work','money','travel'])if(KW[k].test(q.toLowerCase()))return k;return'life'}function rand(a){return a[Math.floor(Math.random()*a.length)]}function modeName(){let i=keys.indexOf(mode);return UI[lang].cards[i][0]+' '+UI[lang].cards[i][1]}function setMode(m,reanswer=true){mode=m;localStorage.setItem('whyMode',mode);renderCards();renderResultModes();if(reanswer&&document.getElementById('result').classList.contains('show')&&document.getElementById('question').value.trim())answer()}
function answer(){let q=document.getElementById('question').value.trim();if(!q)return;if(danger.test(q)){let x=lang==='ru'?['СТОП','Здесь лучше выбрать безопасный вариант и обратиться за реальной помощью']:lang==='ro'?['STOP','Aici e mai bine să alegi varianta sigură și să cauți ajutor real']:['STOP','Choose the safe option here and get real help'];show(x);return}let c=cat(q),r=RESP[lang],x;if(mode==='reason'){let b=r.reason[c],yes=Math.random()<.38;x=[yes?b.yes:b.no,b.why]}else if(mode==='universe'){let yes=Math.random()<.55;x=[rand(yes?r.universe.yes:r.universe.no),rand(r.universe.why)]}else if(mode==='human'){let yes=Math.random()<.58;x=[rand(yes?r.human.yes:r.human.no),rand(r.human.why)]}else{let yes=Math.random()<.78;x=[rand(yes?r.wild.yes:r.wild.no),rand(r.wild.why)]}show(x)}function show(x){document.getElementById('verdict').textContent=x[0];document.getElementById('reason').textContent=x[1];document.getElementById('modeLabel').textContent=modeName();renderResultModes();document.getElementById('result').classList.add('show');document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderResultModes(){let box=document.getElementById('resultModes');if(!box)return;box.innerHTML=UI[lang].cards.map((x,i)=>`<button class="result-mode ${keys[i]===mode?'active':''}" data-mode="${keys[i]}" title="${x[1]}">${x[0]} ${x[1]}</button>`).join('');box.querySelectorAll('.result-mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode,true))}
function renderGallery(f='all'){let t=UI[lang],cats=['all','rel','work','money','travel','life'];document.getElementById('filters').innerHTML=t.filters.map((x,i)=>`<button class="filter ${cats[i]===f?'active':''}" data-f="${cats[i]}">${x}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>renderGallery(b.dataset.f));let li=lang==='en'?2:lang==='ru'?3:4;document.getElementById('qgrid').innerHTML=Q.filter(x=>f==='all'||x[1]===f).map(x=>`<button class="qcard" data-q="${x[li].replace(/"/g,'&quot;')}"><span class="qicon">${x[0]}</span><span class="qtext">${x[li]}</span></button>`).join('');document.querySelectorAll('.qcard').forEach(b=>b.onclick=()=>{document.getElementById('question').value=b.dataset.q;answer()})}
function renderCards(){let t=UI[lang];document.getElementById('cards').innerHTML=t.cards.map((x,i)=>`<button class="card ${keys[i]===mode?'active':''}" data-mode="${keys[i]}"><div style="font-size:34px">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></button>`).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>setMode(b.dataset.mode,true))}
function render(){let t=UI[lang];document.documentElement.lang=lang;['askTop','tagline','heroCopy','decide','kicker','again','share','fine','float1','float2','galleryTitle','galleryLead','moodsTitle','footer','disclaimer','modeHint'].forEach((id,i)=>document.getElementById(id).textContent=[t.ask,t.tag,t.hero,t.dec,t.kick,t.again,t.share,t.fine,t.f1,t.f2,t.gt,t.gl,t.moods,t.foot,t.disclaimer,t.hint][i]);document.getElementById('question').placeholder=t.ph;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.getElementById('quick').innerHTML=t.quick.map((x,i)=>`<button>${['✈️','💬','💼','🔥'][i]} ${x}</button>`).join('');document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>{document.getElementById('question').value=b.textContent.replace(/^\S+\s/,'');answer()});renderCards();renderResultModes();renderGallery();if(document.getElementById('result').classList.contains('show'))document.getElementById('modeLabel').textContent=modeName()}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('whyLang',lang);render()});document.getElementById('decide').onclick=answer;document.getElementById('again').onclick=answer;document.getElementById('askTop').onclick=()=>document.getElementById('question').focus();document.getElementById('question').addEventListener('keydown',e=>{if(e.key==='Enter')answer()});document.getElementById('share').onclick=async()=>{let text=`WHY NOT?\n${modeName()}\n${document.getElementById('question').value}\n${document.getElementById('verdict').textContent}\n${document.getElementById('reason').textContent}`;if(navigator.share)try{await navigator.share({text})}catch(e){}else navigator.clipboard?.writeText(text)};render();
</script></body></html>
