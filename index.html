const base={en:{ask:'Ask something',tag:'Let AI decide. Blame it later.',hero:'For the tiny decisions you can absolutely make yourself, but somehow still want external approval for.',ph:'Should I text my ex?',dec:'DECIDE FOR ME',quick:['Book the flight?','Text my ex?','Quit my job?','Sleep with them?'],kick:'WHY NOT? says',again:'Ask again',share:'Share',fine:'Entertainment only. Consent, safety and local law always override the joke.',f1:'“You already know what you want.”',f2:'Certified questionable advice.',gt:'Pick your dilemma.',gl:'No inspiration? Choose one. We have collected the important questions humanity somehow still has not solved.',filters:['All','Relationships','Work','Money','Travel','Life'],moods:'Three moods. Same questionable life.',cards:[['🧠','Rational','Money, consequences, actual facts. Annoyingly sensible.'],['🔮','Universe','Signs, vibes and suspiciously convenient cosmic permission.'],['🍷','Human','The answer your clever friend would give after hearing the full story.']],foot:'Your decision. Our alibi.',v:[['DO IT.','You have already spent more energy thinking about it than the decision deserves.'],['ABSOLUTELY NOT.','Your future self has filed a formal complaint and has a point.'],['WAIT 24 HOURS.','If you still want it tomorrow, at least it will be deliberate.'],['WHY NOT?','Your hesitation sounds suspiciously like excitement wearing a sensible coat.']]},ru:{ask:'Задать вопрос',tag:'Пусть ИИ решит. А виноват будет потом.',hero:'Для мелких жизненных решений, которые вы вполне способны принять сами, но всё равно хочется официального разрешения.',ph:'Написать бывшему?',dec:'РЕШИ ЗА МЕНЯ',quick:['Покупать билет?','Написать бывшему?','Уволиться?','Переспать с ним или с ней?'],kick:'WHY NOT? постановил',again:'Пересчитать',share:'Поделиться',fine:'Только для развлечения. Согласие, безопасность и закон всегда важнее шутки.',f1:'«Ты уже знаешь, чего хочешь.»',f2:'Сертифицированный сомнительный совет.',gt:'Выбери свою дилемму.',gl:'Не знаешь, что сп ['✈️','travel','Book the flight?','Покупать билет?','Să cumpăr biletul?'],['🌍','travel','Go somewhere this weekend?','Куда-нибудь улететь на выходные?','Să plec undeva în weekend?'],['🧳','travel','Move to another country?','Переехать в другую страну?','Să mă mut în altă țară?'],['🏨','travel','Book the nicer hotel?','Взять отель подороже?','Să rezerv hotelul mai bun?'],['🌴','travel','Escape to the sea?','Рвануть к морю?','Să fug la mare?'],['🗺️','travel','Travel alone?','Поехать одному или одной?','Să călătoresc singur?']];
let lang=localStorage.getItem('whynot-lang')||'en',filter='all'; const $=id=>document.getElementById(id); const icons=['✈️','💬','💼','🔥'];
function setLang(l){lang=l;localStorage.setItem('whynot-lang',l);document.documentElement.lang=l;let t=base[l];$('askTop').textContent=t.ask;$('tagline').textContent=t.tag;$('heroCopy').textContent=t.hero;$('question').placeholder=t.ph;$('decide').textContent=t.dec;$('kicker').textContent=t.kick;$('again').textContent=t.again;$('share').textContent=t.share;$('fine').textContent=t.fine;$('float1').textContent=t.f1;$('float2').textContent=t.f2;$('galleryTitle').textContent=t.gt;$('galleryLead').textContent=t.gl;$('moodsTitle').textContent=t.moods;$('footer').textContent=t.foot;document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===l));$('quick').innerHTML=t.quick.map((x,i)=>`<button data-q="${x}">${icons[i]} ${x}</button>`).join('');$('cards').innerHTML=t.cards.map(x=>`<div class="card"><div style="font-size:36px">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('');renderFilters();renderQ();bindQ()}
function renderFilters(){let t=base[lang];let cats=['all','rel','work','money','travel','life'];$('filters').innerHTML=t.filters.map((x,i)=>`<button class="filter ${filter===cats[i]?'active':''}" data-filter="${cats[i]}">${['','🔥 ','💼 ','💸 ','✈️ ','🎲 '][i]}${x}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderFilters();renderQ()})}
function renderQ(){let li={en:2,ru:3,ro:4}[lang];$('qgrid').innerHTML=Q.filter(q=>filter==='all'||q[1]===filter).map(q=>`<button class="qcard" data-q="${q[li].replaceAll('"','&quot;')}"><span class="qicon">${q[0]}</span><span class="qtext">${q[li]}</span></button>`).join('');bindQ()}
function bindQ(){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('question').value=b.dataset.q;decide();window.scrollTo({top:0,behavior:'smooth'})})}
function decide(){let q=$('question').value.trim();if(!q)return $('question').focus();let t=base[lang];let a=t.v[Math.floor(Math.random()*t.v.length)];$('verdict').textContent=a[0];$('reason').textContent=a[1];$('result').classList.add('show')}
$('decide').onclick=decide;$('again').onclick=decide;$('question').onkeydown=e=>{if(e.key==='Enter')decide()};$('askTop').onclick=()=>$('askbox').scrollIntoView({behavior:'smooth'});$('share').onclick=async()=>{let text=`${$('question').value}\n${$('verdict').textContent}\n${$('reason').textContent}\nWHY NOT?`;if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);$('share').textContent=lang==='ru'?'Скопировано!':lang==='ro'?'Copiat!':'Copied!'}};document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));setLang(lang);
