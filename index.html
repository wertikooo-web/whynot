<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHY NOT?</title>
<style>
:root{--ink:#171717;--paper:#f7f0df;--acid:#d9ff4f;--pink:#ff9dc4;--blue:#9ed8ff;--orange:#ffb15a;--white:#fffdf7}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:18px 22px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0 22px}.logo{font-weight:1000;font-size:26px}.logo span{display:inline-block;transform:rotate(-4deg);background:var(--acid);padding:4px 10px;border:2px solid;border-radius:12px}.top{display:flex;gap:8px}.pill{border:2px solid;background:var(--white);border-radius:999px;padding:8px 12px;font-weight:800}.langs{display:flex;gap:4px}.lang.active{background:var(--ink);color:white}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:42px;align-items:center;min-height:690px}.hero h1{font-size:clamp(68px,12vw,170px);line-height:.78;letter-spacing:-8px;margin:0;font-weight:1000}.mark{display:inline-block;background:var(--pink);border:3px solid;padding:4px 16px 10px;border-radius:28px;transform:rotate(-2deg);box-shadow:8px 8px 0}.sub{font-size:clamp(22px,2.5vw,34px);font-weight:850;max-width:660px;line-height:1.03;margin:34px 0 14px}.sub2{font-size:17px;max-width:650px;line-height:1.5;opacity:.78;margin:0 0 26px}.askbox{background:var(--white);border:3px solid;border-radius:26px;padding:14px;display:flex;gap:10px;box-shadow:10px 10px 0;max-width:710px}.askbox input{flex:1;border:0;background:transparent;padding:14px 10px;font-size:18px;outline:0;min-width:0}.askbox button{border:2px solid;background:var(--acid);border-radius:18px;padding:12px 18px;font-weight:1000}.quick{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.quick button{border:2px solid;border-radius:999px;background:transparent;padding:9px 13px;font-weight:800}.quick button:hover{background:var(--ink);color:white}.oracle{position:relative;min-height:530px}.blob{position:absolute;inset:60px 30px 20px 20px;background:var(--blue);border:3px solid;border-radius:44% 56% 52% 48%/55% 43% 57% 45%;transform:rotate(3deg);box-shadow:12px 12px 0}.face{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:min(360px,78%);aspect-ratio:1;border:3px solid;border-radius:50%;background:var(--white)}.eyes{display:flex;gap:68px;position:absolute;top:115px;left:50%;transform:translateX(-50%)}.eye{width:36px;height:46px;background:var(--ink);border-radius:50%}.mouth{position:absolute;top:225px;left:50%;transform:translateX(-50%);width:120px;height:46px;border-bottom:10px solid;border-radius:50%}.float{position:absolute;border:3px solid;background:var(--white);border-radius:20px;padding:14px 16px;font-weight:950;box-shadow:6px 6px 0;max-width:220px}.f1{left:-20px;bottom:34px;transform:rotate(-5deg);background:var(--orange)}.f2{right:-10px;top:75px;transform:rotate(5deg);background:var(--acid)}.result{display:none;margin-top:30px;border:3px solid;border-radius:28px;background:var(--white);padding:26px;box-shadow:10px 10px 0}.result.show{display:block}.kicker{font-weight:900;opacity:.65}.verdict{font-size:clamp(40px,6vw,78px);font-weight:1000;line-height:.92;margin:10px 0 16px}.why{font-size:20px;line-height:1.45}.actions{display:flex;gap:10px;margin-top:20px}.actions button{border:2px solid;border-radius:16px;padding:11px 16px;font-weight:900;background:var(--acid)}.actions button+button{background:var(--pink)}.fine{font-size:12px;opacity:.56;line-height:1.4;margin-top:24px}.section{padding:70px 0 10px}.section h2{font-size:clamp(36px,5vw,72px);line-height:.95;letter-spacing:-3px;margin:0 0 24px}.lead{font-size:20px;max-width:760px;line-height:1.45;opacity:.76}.examples{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.ex{border:2px solid;border-radius:20px;padding:18px;background:transparent;font-size:22px;font-weight:900;text-align:left}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:3px solid;border-radius:24px;padding:22px;background:var(--white);min-height:180px;box-shadow:6px 6px 0}.card:nth-child(2){background:var(--pink)}.card:nth-child(3){background:var(--acid)}.card h3{font-size:24px;margin:14px 0 8px}footer{margin-top:90px;padding-top:24px;border-top:2px solid;display:flex;justify-content:space-between;font-weight:800}@media(max-width:900px){.hero{grid-template-columns:1fr;min-height:auto}.oracle{min-height:440px}.cards,.examples{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:12px 14px 50px}.hero h1{font-size:78px;letter-spacing:-5px}.askbox{flex-direction:column}.oracle{min-height:390px}.face{width:260px}.eyes{top:82px}.mouth{top:170px}.float{font-size:14px;max-width:170px}.top>.pill{display:none}}
</style></head><body><div class="wrap">
<header><div class="logo"><span>WHY NOT?</span></div><div class="top"><button class="pill" id="askTop"></button><div class="langs"><button class="pill lang" data-lang="en">EN</button><button class="pill lang" data-lang="ru">RU</button><button class="pill lang" data-lang="ro">RO</button></div></div></header>
<main><section class="hero"><div><h1>WHY <span class="mark">NOT?</span></h1><div class="sub" id="tagline"></div><p class="sub2" id="heroCopy"></p><div class="askbox" id="askbox"><input id="question" maxlength="180"><button id="decide"></button></div><div class="quick" id="quick"></div><div class="result" id="result"><div class="kicker" id="kicker"></div><div class="verdict" id="verdict"></div><div class="why" id="reason"></div><div class="actions"><button id="again"></button><button id="share"></button></div><div class="fine" id="fine"></div></div></div><div class="oracle"><div class="blob"></div><div class="face"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div></div><div class="float f1" id="float1"></div><div class="float f2" id="float2"></div></div></section>
<section class="section"><h2 id="sectionTitle"></h2><p class="lead" id="sectionLead"></p><div class="examples" id="examples"></div></section><section class="section"><h2 id="moodsTitle"></h2><div class="cards" id="cards"></div></section></main><footer><div>WHY NOT?</div><div id="footer"></div></footer></div>
<script>
const T={en:{askTop:'Ask something',tagline:'Let AI decide. Blame it later.',hero:'For the tiny decisions you can absolutely make yourself, but somehow still want external approval for.',ph:'Should I text my ex?',decide:'DECIDE FOR ME',quick:[['✈️','Book the flight?'],['💬','Text my ex?'],['💼','Quit my job?'],['🔥','Sleep with them?']],kicker:'WHY NOT? says',again:'Ask again',share:'Share',fine:'Entertainment only. For health, legal, financial or safety decisions, use actual judgment and qualified advice. Consent, safety and local law always override the joke.',f1:'“You already know what you want.”',f2:'Certified questionable advice.',title:'Ask the question you already know the answer to.',lead:'WHY NOT? turns everyday hesitation into a tiny ceremony. You ask. The oracle judges. You keep full responsibility, obviously.',examples:[['👟','Buy these ridiculous shoes?'],['❤️','Go on the date?'],['🌴','Call in sick and go to the beach?'],['🧳','Move to another country?']],moods:'Three moods. Same questionable life.',cards:[['🧠','Rational','Money, consequences, actual facts. Annoyingly sensible.'],['🔮','Universe','Signs, vibes and suspiciously convenient cosmic permission.'],['🍷','Human','The answer your clever friend would give after hearing the full story.']],footer:'Your decision. Our alibi.',verdicts:[['DO IT.','You have already spent more energy thinking about it than the decision deserves.'],['ABSOLUTELY NOT.','Your future self has filed a formal complaint and, for once, has a point.'],['WAIT 24 HOURS.','If you still want it tomorrow, at least it will be deliberate.'],['WHY NOT?','Your hesitation sounds suspiciously like excitement wearing a sensible coat.']]},
ru:{askTop:'Задать вопрос',tagline:'Пусть ИИ решит. А виноват будет потом.',hero:'Для мелких жизненных решений, которые вы вполне способны принять сами, но всё равно хочется официального разрешения.',ph:'Написать бывшему?',decide:'РЕШИ ЗА МЕНЯ',quick:[['✈️','Покупать билет?'],['💬','Написать бывшему?'],['💼','Уволиться?'],['🔥','Переспать с ним или с ней?']],kicker:'WHY NOT? постановил',again:'Пересчитать',share:'Поделиться',fine:'Только для развлечения. В вопросах здоровья, права, денег и безопасности полагайтесь на здравый смысл и специалистов. Согласие, безопасность и закон всегда важнее шутки.',f1:'«Ты уже знаешь, чего хочешь.»',f2:'Сертифицированный сомнительный совет.',title:'Задай вопрос, ответ на который ты уже знаешь.',lead:'WHY NOT? превращает обычные сомнения в маленькую церемонию. Ты спрашиваешь. Оракул судит. Ответственность, разумеется, остаётся у тебя.',examples:[['👟','Купить эти нелепые туфли?'],['❤️','Идти на свидание?'],['🌴','Прогулять работу и поехать на пляж?'],['🧳','Переехать в другую страну?']],moods:'Три настроения. Та же сомнительная жизнь.',cards:[['🧠','Разумно','Деньги, последствия и факты. До обидного здраво.'],['🔮','По Вселенной','Знаки, ощущения и подозрительно удобное разрешение космоса.'],['🍷','По-человечески','Ответ умного друга, который уже выслушал всю историю.']],footer:'Решение ваше. Алиби наше.',verdicts:[['ДЕЛАЙ.','Ты уже потратил на размышления больше энергии, чем заслуживает это решение.'],['ТОЧНО НЕТ.','Твоя завтрашняя версия уже написала жалобу. На этот раз по делу.'],['ПОДОЖДИ ДО ЗАВТРА.','Если завтра всё ещё захочется, решение хотя бы будет осознанным.'],['ПОЧЕМУ БЫ И НЕТ?','Твои сомнения подозрительно похожи на желание, которое надело приличный пиджак.']]},
ro:{askTop:'Pune o întrebare',tagline:'Lasă IA să decidă. Dă vina pe ea mai târziu.',hero:'Pentru micile decizii pe care le poți lua singur, dar pentru care tot vrei o aprobare oficială.',ph:'Să-i scriu fostului sau fostei?',decide:'DECIDE PENTRU MINE',quick:[['✈️','Să cumpăr biletul?'],['💬','Să-i scriu fostului sau fostei?'],['💼','Să-mi dau demisia?'],['🔥','Să mă culc cu el sau cu ea?']],kicker:'WHY NOT? a decis',again:'Mai întreabă o dată',share:'Distribuie',fine:'Doar pentru divertisment. Pentru sănătate, probleme juridice, bani sau siguranță, folosește-ți judecata și cere sfatul unui specialist. Consimțământul, siguranța și legea sunt întotdeauna mai importante decât gluma.',f1:'„Știi deja ce vrei.”',f2:'Sfat îndoielnic certificat.',title:'Pune întrebarea la care știi deja răspunsul.',lead:'WHY NOT? transformă ezitările zilnice într-o mică ceremonie. Tu întrebi. Oracolul judecă. Responsabilitatea rămâne, evident, la tine.',examples:[['👟','Să cumpăr pantofii ăștia ridicoli?'],['❤️','Să merg la întâlnire?'],['🌴','Să chiulesc de la muncă și să merg la plajă?'],['🧳','Să mă mut în altă țară?']],moods:'Trei stări. Aceeași viață discutabilă.',cards:[['🧠','Rațional','Bani, consecințe și fapte. Enervant de logic.'],['🔮','După Univers','Semne, intuiție și o permisiune cosmică suspect de convenabilă.'],['🍷','Omenește','Răspunsul prietenului deștept care a ascultat deja toată povestea.']],footer:'Decizia ta. Alibiul nostru.',verdicts:[['FĂ-O.','Ai consumat deja mai multă energie gândindu-te decât merită decizia.'],['CLAR NU.','Versiunea ta de mâine a depus deja o plângere. De data asta are dreptate.'],['AȘTEAPTĂ PÂNĂ MÂINE.','Dacă încă vrei asta mâine, măcar va fi o decizie asumată.'],['DE CE NU?','Ezitarea ta seamănă suspect de mult cu entuziasmul îmbrăcat într-un costum serios.']]}};
let lang=localStorage.getItem('whynot-lang')||'en',last='';const $=id=>document.getElementById(id);
function render(){const t=T[lang];document.documentElement.lang=lang;$('askTop').textContent=t.askTop;$('tagline').textContent=t.tagline;$('heroCopy').textContent=t.hero;$('question').placeholder=t.ph;$('decide').textContent=t.decide;$('kicker').textContent=t.kicker;$('again').textContent=t.again;$('share').textContent=t.share;$('fine').textContent=t.fine;$('float1').textContent=t.f1;$('float2').textContent=t.f2;$('sectionTitle').textContent=t.title;$('sectionLead').textContent=t.lead;$('moodsTitle').textContent=t.moods;$('footer').textContent=t.footer;$('quick').innerHTML=t.quick.map(x=>`<button data-q="${x[1]}">${x[0]} ${x[1]}</button>`).join('');$('examples').innerHTML=t.examples.map(x=>`<button class="ex" data-q="${x[1]}">${x[0]} ${x[1]}</button>`).join('');$('cards').innerHTML=t.cards.map(x=>`<div class="card"><div style="font-size:36px">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('');document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));bindQ();$('result').classList.remove('show')}
function bindQ(){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('question').value=b.dataset.q;decide()})}
function decide(){const q=$('question').value.trim();if(!q){$('question').focus();return}last=q;const a=T[lang].verdicts[Math.floor(Math.random()*T[lang].verdicts.length)];$('verdict').textContent=a[0];$('reason').textContent=a[1];$('result').classList.add('show');$('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
$('decide').onclick=decide;$('again').onclick=decide;$('question').onkeydown=e=>{if(e.key==='Enter')decide()};$('askTop').onclick=()=>$('askbox').scrollIntoView({behavior:'smooth'});document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('whynot-lang',lang);render()});$('share').onclick=async()=>{const text=`WHY NOT?\n${last}\n${$('verdict').textContent}\n${$('reason').textContent}`;if(navigator.share)try{await navigator.share({title:'WHY NOT?',text})}catch(e){}else{await navigator.clipboard.writeText(text);alert(lang==='ru'?'Скопировано':lang==='ro'?'Copiat':'Copied')}};render();
</script></body></html>
